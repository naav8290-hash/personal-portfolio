<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1125" width="900" height="1125" role="img" aria-label="Abstract maroon studio detail placeholder">
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#641C2B"/>
      <stop offset=".6" stop-color="#3D111C"/>
      <stop offset="1" stop-color="#101010"/>
    </linearGradient>
    <radialGradient id="halo" cx=".28" cy=".2" r=".72">
      <stop offset="0" stop-color="#B05366" stop-opacity=".4"/>
      <stop offset=".6" stop-color="#641C2B" stop-opacity=".1"/>
      <stop offset="1" stop-color="#101010" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain2" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope=".4"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="900" height="1125" fill="#101010"/>
  <rect width="900" height="1125" fill="url(#field)"/>
  <rect width="900" height="1125" fill="url(#halo)"/>

  <g fill="none" stroke="#F5F3F0" opacity=".24">
    <circle cx="450" cy="470" r="272" stroke-width="1.5"/>
    <circle cx="450" cy="470" r="196" stroke-width="1"/>
    <path d="M96 470h708M450 116v708" stroke-width="1" opacity=".55"/>
  </g>

  <g fill="#F5F3F0" opacity=".62">
    <circle cx="450" cy="470" r="5"/>
    <circle cx="722" cy="470" r="3"/>
    <circle cx="450" cy="198" r="3"/>
  </g>

  <rect x="96" y="936" width="708" height="1" fill="#F5F3F0" opacity=".24"/>
  <rect x="96" y="88" width="128" height="128" fill="none" stroke="#F5F3F0" stroke-width="1.5" opacity=".35"/>
  <rect x="590" y="88" width="214" height="42" fill="#101010" opacity=".55"/>
  <rect x="96" y="988" width="214" height="42" fill="#F5F3F0" opacity=".12"/>

  <text x="450" y="545" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="210" fill="#F5F3F0" opacity=".1">2008</text>

  <rect width="900" height="1125" filter="url(#grain2)" opacity=".32" style="mix-blend-mode:overlay"/>
